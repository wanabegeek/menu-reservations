<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Christmas Menu Reservations</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f8fafc;color:#0f172a;margin:0}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 16px}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px}
  label{font-size:14px;display:block;margin-bottom:8px}
  label.inline-row { display:flex; align-items:center; gap:8px; }
  label.inline-row > .controls { display:flex; align-items:center; gap:8px; }
  input,select{width:auto;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
  .row{display:grid;gap:12px}
  @media(min-width:720px){.row-3{grid-template-columns:1fr 1fr 1fr}.row-2{grid-template-columns:1fr 1fr}.row-5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}}
  button{cursor:pointer;border:0;border-radius:12px;padding:10px 16px}
  .btn-dark{background:#0f172a;color:#fff}
  .btn-red{background:#e11d48;color:#fff}
  .muted{color:#64748b;font-size:12px}
  #feedback{white-space:pre-line}
  .error{border-color:#be123c;color:#9f1239}
  button:disabled{opacity:.6;cursor:wait}
  .row > label{min-width:0}
  .row input,.row select{box-sizing:border-box;max-width:100%}
  .person-card input,.person-card select{display:block;width:100%;margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <strong>Christmas Menu Reservation & Orders</strong>
    <span id="status" class="muted"></span>
  </div>
</header>
<main class="wrap">
  <div class="card">
    <h3>Reservation</h3>
    <div class="row row-3">
      <label for="res_name">Reservation Name <input id="res_name" placeholder="Smith" /></label>
      <label for="res_contact">Contact Details <input id="res_contact" placeholder="email or phone" /></label>
      <label for="res_people">Number of People <input id="res_people" type="number" min="1" step="1" value="1" /></label>
    </div>
    <div class="row row-2" style="margin-top:8px">
     <label for="res_date">Date
       <input id="res_date" type="date" />
     </label>
    <label class="inline-row" for="res_hour">
      <span>Time</span>
      <div class="controls" style="margin-top:4px">
        <select id="res_hour" aria-label="Hour"></select>
        <span>:</span>
        <select id="res_minute" aria-label="Minute"></select>
      </div>
    </label>
    </div>
    <div style="margin-top:10px">
      <button id="btn-build" class="btn-dark" type="button">Next</button>
    </div>
    <p class="muted" style="margin-top:8px">Each person must choose from at least two sections (starter/main/dessert) and only one choice per section.</p>
  </div>

  <div id="guests"></div>

  <div class="card">
    <button id="btn-submit" class="btn-red" type="button">Submit</button>
  </div>

  <div id="feedback" class="card" role="status" aria-live="polite" hidden></div>
  <noscript>Please enable JavaScript to make a reservation.</noscript>
</main>

<script>
(() => {
  'use strict';

  // Update this section for each season. Keep the existing backend payload format.
  const CONFIG = {
    startDate: '2026-11-23', endDate: '2026-12-24',
    openingTime: '12:00', closingTime: '14:30', intervalMinutes: 5,
    dishes: {
      starter: ['Soup', 'Pate', 'Parma Ham, Pear & Rocket'],
      main: ['Turkey', 'Haddock', 'Mushroom Tagliatelle', 'Cauliflower'],
      dessert: ['Cheesecake', 'Bread & Butter Pudding', 'Chocolate & Orange Mousse']
    },
    endpoint: 'https://menu-reservations-worker.neil-kennedy2207.workers.dev/',
    availabilityEndpoint: 'https://script.google.com/macros/s/AKfycbyDyDyVPkzfUFMYX1bGs1G9Y-mKSJFatIJ0hY5wKA1YdkkiHFPt0F0Uf1ie723alBY7UQ/exec'
  };
  const $ = id => document.getElementById(id);
  const courses = Object.keys(CONFIG.dishes);
  const guestCards = [];
  let busy = false;
  let checkedSlot = '';
  let attempt = null;

  function message(text, error = false) {
    $('feedback').textContent = text;
    $('feedback').className = error ? 'card error' : 'card';
    $('feedback').hidden = !text;
  }
  function localToday() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  }
  function minutes(time) {
    const [h, m] = time.split(':').map(Number);
    return h * 60 + m;
  }
  const slots = [];
  for (let n = minutes(CONFIG.openingTime); n <= minutes(CONFIG.closingTime); n += CONFIG.intervalMinutes) {
    slots.push(`${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`);
  }
  function option(value, label = value) {
    const el = document.createElement('option');
    el.value = value; el.textContent = label;
    return el;
  }
  function updateMinutes() {
    const previous = $('res_minute').value || '00';
    const allowed = slots.filter(t => t.startsWith($('res_hour').value + ':')).map(t => t.slice(3));
    $('res_minute').replaceChildren(...allowed.map(m => option(m)));
    $('res_minute').value = allowed.includes(previous) ? previous : allowed[allowed.length - 1];
  }
  function details() {
    return {
      reservationName: $('res_name').value.trim(), contact: $('res_contact').value.trim(),
      date: $('res_date').value, time: `${$('res_hour').value}:${$('res_minute').value}`,
      people: Number($('res_people').value)
    };
  }
  function slotKey(res) { return JSON.stringify([res.date, res.time, res.people]); }
  function validateDetails(res, full = false) {
    const errors = [];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(res.date) || res.date < CONFIG.startDate || res.date > CONFIG.endDate || res.date < localToday()) {
      errors.push('Choose a remaining date between 23 November and 24 December 2026.');
    }
    if (!slots.includes(res.time)) errors.push('Choose a service time between 12:00 and 14:30.');
    if (!Number.isSafeInteger(res.people) || res.people < 1) errors.push('Enter a whole number of people, at least 1.');
    if (full && !res.reservationName) errors.push('Enter a reservation name.');
    if (full && !res.contact) errors.push('Enter a contact email address or phone number.');
    return errors;
  }
  function guestCard(index) {
    const card = document.createElement('div'); card.className = 'card person-card';
    const title = document.createElement('h3'); title.textContent = `Person ${index + 1}`;
    const grid = document.createElement('div'); grid.className = 'row row-5';
    for (const [key, titleText] of [['name', 'Name'], ['starter', 'Starter'], ['main', 'Main'], ['dessert', 'Dessert'], ['notes', 'Allergies / Dietary']]) {
      const label = document.createElement('label'); label.textContent = titleText;
      const input = document.createElement(courses.includes(key) ? 'select' : 'input');
      input.dataset.field = key;
      if (courses.includes(key)) input.replaceChildren(option('', 'No selection'), ...CONFIG.dishes[key].map(d => option(d)));
      else input.placeholder = key === 'name' ? 'Full name' : 'e.g., nuts, gluten-free';
      label.appendChild(input); grid.appendChild(label);
    }
    card.append(title, grid); return card;
  }
  function buildGuests(count) {
    // Reuse cards, including temporarily removed guests, so changing the count loses no choices.
    while (guestCards.length < count) guestCards.push(guestCard(guestCards.length));
    $('guests').replaceChildren(...guestCards.slice(0, count));
  }
  function collectGuests() {
    return Array.from($('guests').children, card => Object.fromEntries(
      Array.from(card.querySelectorAll('[data-field]'), input => [input.dataset.field, input.value.trim()])
    ));
  }
  function validateGuests(res) {
    const errors = [];
    if (res.guests.length !== res.people) errors.push('Click Next to update the guest forms for your party size.');
    res.guests.forEach((guest, i) => {
      if (!guest.name) errors.push(`Person ${i + 1}: enter a name.`);
      if (courses.filter(c => guest[c]).length < 2) errors.push(`Person ${i + 1}: choose at least two courses.`);
      if (courses.some(c => guest[c] && !CONFIG.dishes[c].includes(guest[c]))) errors.push(`Person ${i + 1}: choose dishes from the current menu.`);
    });
    return errors;
  }
  function setBusy(value) {
    busy = value;
    document.querySelectorAll('input, select, button').forEach(el => { el.disabled = value; });
    $('btn-submit').disabled = value || !$('guests').children.length;
    $('status').textContent = value ? ' — Please wait…' : '';
  }
  function checkAvailability(res) {
    return new Promise((resolve, reject) => {
      const callback = 'availability_' + crypto.randomUUID().replaceAll('-', '');
      const script = document.createElement('script');
      const url = new URL(CONFIG.availabilityEndpoint);
      Object.entries({action: 'availability', date: res.date, time: res.time, people: String(res.people), callback}).forEach(([k, v]) => url.searchParams.set(k, v));
      function cleanup() { clearTimeout(timer); script.remove(); delete window[callback]; }
      const timer = setTimeout(() => { cleanup(); reject(new Error('Availability check timed out. Please try again.')); }, 10000);
      window[callback] = result => {
        cleanup();
        if (!result || result.ok === false || result.canBook !== true) {
          const reasons = result?.details?.reasons || result?.reasons || result?.error || 'This time is not available.';
          reject(new Error(Array.isArray(reasons) ? reasons.join('\n') : String(reasons)));
        } else resolve();
      };
      script.onerror = () => { cleanup(); reject(new Error('Could not check availability. Please try again.')); };
      script.src = url.toString(); document.head.appendChild(script);
    });
  }
  async function submitReservation(res) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    try {
      const response = await fetch(CONFIG.endpoint, {
        method: 'POST', headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({action: 'create', reservation: res}), signal: controller.signal
      });
      const ack = await response.json();
      if (response.ok && ack?.ok === true) return;
      if (response.ok && ack?.ok === false) throw new Error('The server did not accept your booking. Your details are still here; check availability and try again.');
      throw new Error('Unconfirmed response');
    } catch (error) {
      if (error.message.startsWith('The server did not accept')) throw error;
      // A lost response can mean the server saved the booking. Never send a second automatic request.
      throw new Error(`We could not confirm whether your booking was received. Your details are still here. Please contact the venue before submitting again, quoting reference ${res.id}.`);
    } finally { clearTimeout(timer); }
  }
  function confirmationText(res) {
    const date = new Date(res.date + 'T12:00:00').toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
    return [
      'Thank you — your booking has been received!',
      '', "This booking is provisional. To finalise your booking a £10 deposit per person is required. This can be paid in person at Ale & Pate, or by card over the phone by calling 01383821599",
      '', 'We look forward to welcoming you to Ale & Pate.',
      'Please save or take a screenshot of these details for your records. No confirmation email has been sent.',
      '', 'Booking reference: ' + res.id,
      'Booking name: ' + res.reservationName,
      'Date: ' + date, 'Time: ' + res.time, 'Guests: ' + res.people,
      '', 'Menu choices:',
      ...res.guests.map((g, i) => [(i + 1) + '. ' + g.name, 'Starter: ' + (g.starter || 'None'), 'Main: ' + (g.main || 'None'), 'Dessert: ' + (g.dessert || 'None'), ...(g.notes ? ['Dietary requirements: ' + g.notes] : [])].join('\n')),
      '', 'If you need to change your booking, please contact Ale & Pate and quote your booking reference.'
    ].join('\n');
  }
  function bookingPdf(text) {
    // Render text with the browser's fonts so names, accents and the pound sign are retained.
    const canvas = document.createElement('canvas'); canvas.width = 1240; canvas.height = 1754;
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('PDF rendering is not available in this browser.');
    ctx.font = '24px Arial, sans-serif';
    const lines = [];
    for (const paragraph of ('Ale & Pate — Provisional booking\n\n' + text).split('\n')) {
      let line = '';
      for (const word of paragraph.split(' ')) {
        const candidate = line ? line + ' ' + word : word;
        if (ctx.measureText(candidate).width <= 1120) { line = candidate; continue; }
        if (line) lines.push(line);
        line = '';
        for (const char of word) {
          if (ctx.measureText(line + char).width > 1120) { lines.push(line); line = ''; }
          line += char;
        }
      }
      lines.push(line);
    }
    const images = [];
    for (let start = 0; start < lines.length; start += 46) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1240, 1754);
      ctx.fillStyle = '#17202a'; ctx.font = '24px Arial, sans-serif';
      lines.slice(start, start + 46).forEach((line, i) => ctx.fillText(line, 60, 80 + i * 34));
      ctx.font = '20px Arial, sans-serif';
      ctx.fillText('Page ' + (images.length + 1) + ' of ' + Math.ceil(lines.length / 46), 60, 1700);
      images.push(Uint8Array.from(atob(canvas.toDataURL('image/jpeg', 0.92).split(',')[1]), c => c.charCodeAt(0)));
    }
    const encoder = new TextEncoder(); const parts = []; const offsets = [0]; let size = 0;
    const add = value => { const bytes = typeof value === 'string' ? encoder.encode(value) : value; parts.push(bytes); size += bytes.length; };
    const object = (id, content, bytes) => {
      offsets[id] = size; add(id + ' 0 obj\n' + content);
      if (bytes) { add('\nstream\n'); add(bytes); add('\nendstream'); }
      add('\nendobj\n');
    };
    add('%PDF-1.4\n');
    object(1, '<< /Type /Catalog /Pages 2 0 R >>');
    object(2, '<< /Type /Pages /Count ' + images.length + ' /Kids [' + images.map((_, i) => (5 + i * 3) + ' 0 R').join(' ') + '] >>');
    images.forEach((image, i) => {
      const id = 3 + i * 3;
      object(id, '<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + image.length + ' >>', image);
      const drawing = encoder.encode('q 595.28 0 0 841.89 0 0 cm /Receipt Do Q');
      object(id + 1, '<< /Length ' + drawing.length + ' >>', drawing);
      object(id + 2, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Receipt ' + id + ' 0 R >> >> /Contents ' + (id + 1) + ' 0 R >>');
    });
    const xref = size;
    add('xref\n0 ' + offsets.length + '\n0000000000 65535 f \n');
    offsets.slice(1).forEach(offset => add(String(offset).padStart(10, '0') + ' 00000 n \n'));
    add('trailer\n<< /Size ' + offsets.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
    return new Blob(parts, {type: 'application/pdf'});
  }
  function showConfirmation(res) {
    const text = confirmationText(res);
    message(text);
    const dialog = document.createElement('dialog');
    dialog.setAttribute('aria-labelledby', 'booking-confirmation-title');
    dialog.style.cssText = 'max-width:600px;width:calc(100% - 48px);max-height:85vh;box-sizing:border-box;border:1px solid #ddd;border-radius:12px;padding:24px;overflow:auto;color:#17202a;background:white';
    const heading = document.createElement('h2');
    heading.id = 'booking-confirmation-title'; heading.textContent = 'Provisional booking received';
    const summary = document.createElement('div');
    summary.style.whiteSpace = 'pre-wrap'; summary.textContent = text;
    const save = document.createElement('button'); save.type = 'button'; save.textContent = 'Save booking as PDF';
    const saveHelp = document.createElement('p');
    saveHelp.textContent = 'Save a PDF copy of your booking. If your browser does not offer a save-location window, the PDF will go to your downloads.';
    saveHelp.setAttribute('role', 'status');
    save.addEventListener('click', async () => {
      save.disabled = true;
      try {
        const filename = 'ale-and-pate-booking-' + res.id + '.pdf';
        let handle;
        if (typeof window.showSaveFilePicker === 'function') {
          try { handle = await window.showSaveFilePicker({suggestedName: filename, types: [{description: 'PDF document', accept: {'application/pdf': ['.pdf']}}]}); }
          catch (error) { if (error.name === 'AbortError') return; }
        }
        const pdf = bookingPdf(text);
        if (handle) {
          const writable = await handle.createWritable(); await writable.write(pdf); await writable.close();
          saveHelp.textContent = 'Your booking PDF has been saved.';
        } else {
          const url = URL.createObjectURL(pdf);
          const link = document.createElement('a'); link.href = url; link.download = filename;
          document.body.appendChild(link); link.click(); link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          saveHelp.textContent = 'Your PDF download has started. Check your browser downloads for the booking file.';
        }
      } catch (error) {
        saveHelp.textContent = 'The PDF could not be saved. Please try again or take a screenshot of your booking details. Your booking has already been received.';
      } finally { save.disabled = false; }
    });
    const close = document.createElement('button'); close.type = 'button'; close.textContent = 'Close';
    close.style.marginLeft = '12px'; close.addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => dialog.remove());
    const actions = document.createElement('p'); actions.append(save, close);
    dialog.append(heading, summary, saveHelp, actions); document.body.appendChild(dialog);
    if (typeof dialog.showModal === 'function') { dialog.showModal(); save.focus(); }
    else { dialog.remove(); alert(text); }
  }
  function reset() {
    $('res_name').value = ''; $('res_contact').value = ''; $('res_people').value = '1';
    const today = localToday();
    $('res_date').value = today <= CONFIG.startDate ? CONFIG.startDate : today <= CONFIG.endDate ? today : '';
    $('res_hour').value = CONFIG.openingTime.slice(0, 2); updateMinutes();
    $('res_minute').value = CONFIG.openingTime.slice(3);
    $('guests').replaceChildren(); guestCards.length = 0; checkedSlot = ''; attempt = null;
  }
  $('res_date').min = CONFIG.startDate; $('res_date').max = CONFIG.endDate;
  $('res_hour').replaceChildren(...[...new Set(slots.map(t => t.slice(0, 2)))].map(h => option(h)));
  $('res_hour').addEventListener('change', updateMinutes);
  $('btn-build').addEventListener('click', async () => {
    if (busy) return;
    const res = details(); const errors = validateDetails(res);
    if (errors.length) return message(errors.join('\n'), true);
    setBusy(true); message('Checking availability…');
    try {
      await checkAvailability(res); checkedSlot = slotKey(res); buildGuests(res.people);
      message('Please enter each guest’s name and choose at least two courses.');
    } catch (error) { checkedSlot = ''; message(error.message, true); }
    finally { setBusy(false); }
  });
  $('btn-submit').addEventListener('click', async () => {
    if (busy) return;
    const res = {...details(), guests: collectGuests()};
    const errors = [...validateDetails(res, true), ...validateGuests(res)];
    if (slotKey(res) !== checkedSlot) errors.push('The booking date, time or party size changed. Click Next to check availability again.');
    if (errors.length) return message(errors.join('\n'), true);
    const fingerprint = JSON.stringify(res);
    if (!attempt || attempt.fingerprint !== fingerprint) attempt = {fingerprint, id: crypto.randomUUID(), createdAt: new Date().toISOString()};
    Object.assign(res, {id: attempt.id, createdAt: attempt.createdAt});
    setBusy(true); message('Checking availability and submitting your booking…');
    try {
      await checkAvailability(res);
      await submitReservation(res);
      reset(); showConfirmation(res);
    } catch (error) { message(error.message, true); }
    finally { setBusy(false); }
  });
  reset(); setBusy(false);
})();

</script>
</body>
</html>
